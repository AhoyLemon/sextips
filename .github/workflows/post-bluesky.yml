name: Post to BlueSky

on:
  schedule:
    # BEGIN AUTO-GENERATED SCHEDULE (updated daily by scripts/reschedule-bluesky.ts — do not hand-edit)
    - cron: "20 16 * * *"
    - cron: "47 20 * * *"
    - cron: "0 2 * * *"
    - cron: "8 5 * * *"
    # END AUTO-GENERATED SCHEDULE
  workflow_dispatch:

concurrency:
  group: post-bluesky
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  post:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.WORKFLOW_PAT }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun ci

      - name: Post tip to BlueSky
        run: bun run post:bluesky
        env:
          BLUESKY_IDENTIFIER: ${{ secrets.BLUESKY_IDENTIFIER }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}

      # always() so a failed post doesn't also skip rescheduling — otherwise
      # tomorrow's window would silently never get generated. Only a
      # `schedule` trigger carries github.event.schedule — a manual
      # workflow_dispatch run always posts (above) and never reschedules.
      - name: Determine whether this was the day's last scheduled slot
        id: last_slot
        if: always() && github.event_name == 'schedule'
        env:
          THIS_SCHEDULE: ${{ github.event.schedule }}
        run: |
          LAST_CRON=$(awk '/BEGIN AUTO-GENERATED SCHEDULE/,/END AUTO-GENERATED SCHEDULE/' .github/workflows/post-bluesky.yml \
            | grep -oP '(?<=cron: ")[^"]+' | tail -n1)
          echo "Last committed slot: $LAST_CRON — this run: $THIS_SCHEDULE"
          if [ "$LAST_CRON" = "$THIS_SCHEDULE" ]; then
            echo "is_last=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_last=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Reschedule tomorrow's posting window
        if: always() && steps.last_slot.outputs.is_last == 'true'
        run: bun scripts/reschedule-bluesky.ts

      - name: Commit and push tomorrow's schedule
        if: always() && steps.last_slot.outputs.is_last == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/post-bluesky.yml
          git commit -m "Reschedule BlueSky posting window for tomorrow"
          git push
