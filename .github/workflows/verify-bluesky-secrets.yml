name: Verify BlueSky Secrets

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check BlueSky auth
        env:
          BLUESKY_IDENTIFIER: ${{ secrets.BLUESKY_IDENTIFIER }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
        run: |
          status=$(curl -s -o /tmp/response.json -w "%{http_code}" -X POST https://bsky.social/xrpc/com.atproto.server.createSession \
            -H "Content-Type: application/json" \
            -d "{\"identifier\":\"$BLUESKY_IDENTIFIER\",\"password\":\"$BLUESKY_APP_PASSWORD\"}")
          if [ "$status" = "200" ]; then
            echo "BlueSky authentication succeeded."
          else
            echo "BlueSky authentication failed (HTTP $status)."
            cat /tmp/response.json
            exit 1
          fi
